name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      - name: Make sure moc is installed
        run: mops toolchain bin moc || mops toolchain use moc latest

      - name: Show mops version
        run: mops -v

      - name: Run mops test
        run: mops test

  bench:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      # Install the pinned [toolchain] binaries (moc, wasmtime, pocket-ic).
      # mops bench starts and stops its own pocket-ic replica.
      - name: Init toolchain and install deps
        run: |
          mops toolchain init
          mops install

      - name: Run mops bench
        run: mops bench
