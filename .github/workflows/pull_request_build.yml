name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      - name: Make sure moc is installed
        run: mops toolchain bin moc || mops toolchain use moc latest

      - name: Show mops version
        run: mops -v

      - name: Run mops test
        run: mops test

  bench:
    # ubuntu-24.04: dfx 0.32.0 needs GLIBC_2.39, absent on ubuntu-22.04 (2.35).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      # Benchmarks run on the dfx replica (more accurate/stable than pocket-ic).
      - name: Install dfx (benchmark replica)
        uses: dfinity/setup-dfx@main

      - name: Init toolchain and install deps
        run: |
          mops toolchain init
          mops install

      # mops bench starts and stops its own replica.
      - name: Run mops bench
        run: mops bench --replica dfx
