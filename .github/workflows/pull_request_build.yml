name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      - name: Make sure moc is installed
        run: mops toolchain bin moc || mops toolchain use moc latest

      - name: Show mops version
        run: mops -v

      - name: Run mops test
        run: mops test

  bench:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      # Benchmarks run on pocket-ic: self-contained, robust, the supported mops
      # bench runtime. pocket-ic is NOT pinned in [toolchain] — mops bench uses
      # its own default version, whose counts match the dfx replica (the ~47%
      # inflation we saw was specific to the old pinned pocket-ic 14.0.0). Local
      # `mops bench` defaults to dfx; both now agree.
      - name: Init toolchain and install deps
        run: |
          mops toolchain init
          mops install

      # mops bench downloads + starts/stops its own pocket-ic replica.
      - name: Run mops bench
        run: mops bench --replica pocket-ic
