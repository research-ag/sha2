name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      - name: Make sure moc is installed
        run: mops toolchain bin moc || mops toolchain use moc latest

      - name: Show mops version
        run: mops -v

      - name: Run mops test
        run: mops test

  examples:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: caffeinelabs/setup-mops@v1

      # The examples are their own mops project: examples/mops.toml maps the
      # package name `sha2` to ../src, so the example code imports it exactly
      # as a user would (mo:sha2/...). Their verification file is named
      # verify.mo (not *.test.mo) so the root `mops test` doesn't pick it up —
      # it runs from examples/ with the explicit filter.
      - name: Init toolchain and install deps
        working-directory: examples
        run: |
          mops toolchain init
          mops install

      - name: Verify examples
        working-directory: examples
        run: mops test verify

  bench:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: caffeinelabs/setup-mops@v1

      # Benchmarks run on pocket-ic, pinned HERE ONLY (ephemeral in CI, not
      # committed). The pin makes mops bench self-contained — without it
      # `--replica pocket-ic` needs dfx to provision pocket-ic, which the runner
      # doesn't have. The committed [toolchain] keeps pocket-ic out, so local
      # `mops bench` stays on dfx. CI only compares a PR against its base, so
      # pocket-ic 14.0.0's higher instruction counts cancel out.
      - name: Init toolchain, install deps, pin pocket-ic
        run: |
          mops toolchain init
          mops install
          mops toolchain use pocket-ic 14.0.0

      # mops bench starts and stops its own replica.
      - name: Run mops bench
        run: mops bench --replica pocket-ic
