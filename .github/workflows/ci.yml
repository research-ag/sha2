name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
      - name: Install mops
        uses: caffeinelabs/setup-mops@v1

      - name: Make sure moc is installed
        run: mops toolchain bin moc

      - name: Show versions
        run: |
          mops --version
          $(mops toolchain bin moc) --version

      - name: Install dependencies
        run: mops install --locked

      - name: Run tests
        run: mops test --locked

  examples:
    name: Examples
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
      - name: Install mops
        uses: caffeinelabs/setup-mops@v1

      - name: Install dependencies
        working-directory: examples
        run: mops install --locked

      - name: Verify examples
        working-directory: examples
        run: mops test --locked verify

      - name: Check examples are allocation-free
        working-directory: examples
        run: mops test --locked allocation

  bench:
    name: Benchmarks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
      - name: Install mops
        uses: caffeinelabs/setup-mops@v1

      - name: Install dependencies
        run: mops install --locked

      - name: Make sure pocket-ic is installed
        run: mops toolchain bin pocket-ic

      - name: Make sure wasm-opt is installed
        run: mops toolchain bin wasm-opt

      - name: Run benchmarks
        run: mops bench --locked

  fmt:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Prettier Check
        run: |
          npm install prettier prettier-plugin-motoko --no-save
          npx -y prettier --plugin prettier-plugin-motoko --check '**/*.{mo,json,md}'
