[package]
name = "sha2"
version = "1.0.0"
description = "Optimized implementation of all SHA2 functions"
repository = "https://github.com/research-ag/sha2"
keywords = [ "hash", "sha256", "sha512", "sha224", "sha384" ]
license = "Apache-2.0"

[dependencies]
core = "2.5.0"

[dev-dependencies]
bench-helper = "0.0.3"

[requirements]
moc = "1.0.0"

[optimize]
args = [ "--all-features" ]

[toolchain]
moc = "1.7.0"
wasmtime = "44.0.2"
pocket-ic = "15.0.0"
wasm-opt = "132"
