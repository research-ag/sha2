[package]
name = "sha2"
version = "0.3.1"
description = "Optimized implementation of all SHA2 functions"
repository = "https://github.com/research-ag/sha2"
keywords = [ "hash", "sha256", "sha512", "sha224", "sha384" ]
license = "Apache-2.0"
files = [ "**/*.mo", "examples/mops.toml", "examples/README.md" ]

[dependencies]
core = "2.6.2"

[dev-dependencies]
bench-helper = "0.0.4"

[requirements]
moc = "1.0.0"

[toolchain]
moc = "2.0.0"
wasmtime = "49.0.2"
pocket-ic = "15.0.0"
wasm-opt = "133"

[optimize]
